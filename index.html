<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Restaurant Reservations &amp; Table Management</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "host-board": "pages/host-board/host-board.html",
  "waitlist": "pages/waitlist/waitlist.html",
  "reservations": "pages/reservations/reservations.html",
  "diner-directory": "pages/diner-directory/diner-directory.html",
  "experiences": "pages/experiences/experiences.html",
  "floor-zones": "pages/floor-zones/floor-zones.html",
  "shifts-pacing": "pages/shifts-pacing/shifts-pacing.html",
  "preshift-analytics": "pages/preshift-analytics/preshift-analytics.html",
  "reservation-detail": "pages/reservation-detail/reservation-detail.html",
  "diner-detail": "pages/diner-detail/diner-detail.html",
  "reservation-drawer": "pages/reservation-drawer/reservation-drawer.html",
  "waitlist-drawer": "pages/waitlist-drawer/waitlist-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
